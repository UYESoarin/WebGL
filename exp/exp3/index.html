<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>实验三 · 基于WebGL的纹理映射与光照渲染</title>
  <style>
    body {
      margin: 20px; font-family: "Microsoft YaHei", sans-serif;
      background: #1e1e1e; color: #ddd;
    }
    h1 { font-size: 20px; margin-bottom: 12px; }
    .container { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .left { flex: 0 0 auto; }
    #webgl { border: 1px solid #555; background: #000; display: block; cursor: grab; }
    .panel {
      display: flex; gap: 14px; margin: 10px 0; align-items: center; flex-wrap: wrap;
      background: #2a2a2a; padding: 10px 14px; border-radius: 6px; max-width: 820px;
    }
    .panel label { display: flex; align-items: center; gap: 5px; }
    .panel button {
      background: #2b3d5c; color: #e8f0ff; border: 1px solid #3d5377;
      padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 13px;
    }
    .panel button:hover { background: #3a4f74; }

    /* 右侧光源卡片 */
    .right { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 12px; }
    .light-card {
      background: #2a2a2a; padding: 12px 14px; border-radius: 8px;
      border-left: 4px solid #3a5f8a;
    }
    .light-card .title {
      font-weight: bold; font-size: 14px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
    }
    .light-card .row { display: flex; gap: 10px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
    .light-card label { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .light-card .tag { color: #89a; font-size: 12px; }

    input[type="range"] { width: 84px; }
    input[type="color"] { width: 36px; height: 26px; padding: 0; border: none; }
    .tag { color: #89a; }
    .hint { color: #999; font-size: 13px; max-width: 820px; line-height: 1.7; }
  </style>
</head>
<body onload="main()">
  <h1>实验三 · 纹理映射与光照渲染（多光源 Blinn-Phong，漫游 + 环视）</h1>

  <div class="container">
    <!-- 左侧：场景画布 + 全局设置 -->
    <div class="left">
      <canvas id="webgl" width="800" height="500">
        你的浏览器不支持 canvas，请更换浏览器。
      </canvas>

      <div class="panel">
        <span class="tag">物体：</span>
        <button id="objTorus">圆环体(镂垫)</button>
        <button id="objCube">立方体</button>
        <button id="objSphere">球体</button>
        <label><span class="tag">地面颜色</span> <input id="groundColor" type="color" value="#73737a"></label>
      </div>

      <div class="panel">
        <label>环境光 <input id="ambient" type="range" min="0" max="1" step="0.01" value="0.08"></label>
        <label>镜面强度 <input id="specular" type="range" min="0" max="1" step="0.01" value="0.6"></label>
        <label>光泽度 <input id="shininess" type="range" min="1" max="256" step="1" value="32"></label>
        <label><input id="useTex" type="checkbox" checked> 使用纹理</label>
        <label><input id="shadowOn" type="checkbox" checked> 投射阴影</label>
      </div>

      <p class="hint">
        操作：W/A/S/D 或方向键漫游，E/Q 升降，鼠标拖动环视，滚轮缩放，R 复位视角；物体自动旋转。
        右侧三个光源卡片可分别设置方向/位置、强度、颜色，并单独开关。
      </p>
    </div>

    <!-- 右侧：三个光源设置卡片 -->
    <div class="right">
      <div class="light-card">
        <div class="title">平行光 <label><input id="dirOn" type="checkbox" checked> 开启</label></div>
        <div class="row">
          <span class="tag">方向</span>
          <label>X <input id="dirDX" type="range" min="-2" max="2" step="0.1" value="0.5"></label>
          <label>Y <input id="dirDY" type="range" min="-2" max="2" step="0.1" value="-1"></label>
          <label>Z <input id="dirDZ" type="range" min="-2" max="2" step="0.1" value="0.3"></label>
        </div>
        <div class="row">
          <span class="tag">强度</span> <input id="dirIntensity" type="range" min="0" max="2" step="0.05" value="1">
          <span class="tag">颜色</span> <input id="dirColor" type="color" value="#ffe6b3">
        </div>
      </div>

      <div class="light-card">
        <div class="title">点光源 <label><input id="pointOn" type="checkbox" checked> 开启</label></div>
        <div class="row">
          <span class="tag">位置</span>
          <label>X <input id="lx" type="range" min="-6" max="6" step="0.1" value="3"></label>
          <label>Y <input id="ly" type="range" min="-2" max="8" step="0.1" value="3"></label>
          <label>Z <input id="lz" type="range" min="-6" max="6" step="0.1" value="3"></label>
        </div>
        <div class="row">
          <span class="tag">强度</span> <input id="pointIntensity" type="range" min="0" max="2" step="0.05" value="1">
          <span class="tag">颜色</span> <input id="lightColor" type="color" value="#ff4d40">
        </div>
      </div>

      <div class="light-card">
        <div class="title">聚光灯 <label><input id="spotOn" type="checkbox" checked> 开启</label></div>
        <div class="row">
          <span class="tag">方向</span>
          <label>X <input id="spotDX" type="range" min="-2" max="2" step="0.1" value="0"></label>
          <label>Y <input id="spotDY" type="range" min="-2" max="2" step="0.1" value="-1"></label>
          <label>Z <input id="spotDZ" type="range" min="-2" max="2" step="0.1" value="0"></label>
        </div>
        <div class="row">
          <span class="tag">强度</span> <input id="spotIntensity" type="range" min="0" max="2" step="0.05" value="1">
          <span class="tag">颜色</span> <input id="spotColor" type="color" value="#40ff73">
        </div>
      </div>
    </div>
  </div>

  <script src="../lib/webgl-utils.js"></script>
  <script src="../lib/webgl-debug.js"></script>
  <script src="../lib/cuon-utils.js"></script>
  <script src="../lib/cuon-matrix.js"></script>
  <script src="main.js"></script>
</body>
</html>
